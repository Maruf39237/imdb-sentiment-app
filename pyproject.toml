[project]
name = "nlp-project"
version = "0.1.0"
description = "Classical NLP binary sentiment classification of IMDB movie reviews"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "scikit-learn==1.7.2",
    "nltk>=3.8.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "wordcloud>=1.9.0",
    "joblib==1.6.0",
    "numpy==2.2.6",
    "scipy==1.15.3",
    "plotly>=7.1.0",
    "huggingface-hub==1.16.4",
]

[tool.setuptools]
py-modules = []
